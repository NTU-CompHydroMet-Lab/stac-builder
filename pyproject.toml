[project]
name = "stac-builder"
version = "0.1.0"
description = "Static STAC catalog builder for the NTU CompHydroMet Lab (engine repo)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # STAC core
    "pystac>=1.14.2",
    "stac-validator>=3.10.2",
    "xstac>=1.0.0",
    # Catalog / IO
    "intake>=2.0.8",
    "intake-xarray>=2.0.0",
    "jinja2>=3.1.6",
    "pyyaml>=6.0",
    # xarray ecosystem
    "xarray>=2025.12.0",
    "zarr>=3.1.5",
    "netcdf4>=1.7.3",
    "h5netcdf>=1.7.3",
    "cf-xarray>=0.10.10",
    "dask>=2024.1.0",
    # Tabular
    "pyarrow>=23.0.1",
    "pandas>=2.1.0",
    # Raster / Vector
    "rasterio>=1.4.0",
    "rio-cogeo>=5.4.0",
    "pyproj>=3.6.0",
    "geopandas>=1.0.0",
    "shapely>=2.0.0",
    # Misc
    "antimeridian>=0.4.5",
    "matplotlib>=3.10.8",
    # Modelling / runtime
    "pydantic>=2.5.0",
    "loguru>=0.7.3",
    "typer>=0.20.1",
    "rich>=14.2.0",
]

[project.scripts]
stac-builder = "src.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ipykernel>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
